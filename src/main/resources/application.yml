spring:
  application:
    name: keystone
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:keystone}?serverTimezone=UTC&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

keystone:
  jwt:
    secret: ${JWT_SECRET}                       # required, min 32 chars, never committed
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    dir: ${UPLOAD_DIR:./uploads}
    provider: ${STORAGE_PROVIDER:auto}      # local | cloudinary | auto (cloudinary whenever credentials are present)
  cloudinary:
    url: ${CLOUDINARY_URL:}                 # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:keystone}
  mail:
    from: ${MAIL_FROM:no-reply@keystone.local}   # set SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD to enable e-mail copies
  sla:
    scan-interval-ms: ${SLA_SCAN_INTERVAL_MS:60000}
    at-risk-threshold-percent: 75

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.keystone: INFO
